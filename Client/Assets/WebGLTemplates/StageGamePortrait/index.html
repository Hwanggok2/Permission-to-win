<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2b">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080f1b; }
    body {
      --viewport-height: 100vh;
      --available-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
      --available-height: calc(var(--viewport-height) - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    @supports (height: 100dvh) { body { --viewport-height: 100dvh; } }
    #player {
      position: relative;
      width: min(var(--available-width), calc(var(--available-height) * 0.5625));
      height: min(var(--available-height), calc(var(--available-width) * 1.7777777778));
      min-width: 0; min-height: 0; max-width: 100%; max-height: 100%;
      background: #101b2b;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #loading, #error { position: absolute; inset: 0; display: grid; place-content: center; padding: 28px; color: #f1f5f9; font: 16px/1.6 system-ui, sans-serif; text-align: center; background: #101b2b; }
    #loading strong { color: #6cedc7; font-size: 27px; margin-bottom: 14px; }
    progress { width: min(65vw, 280px); margin-top: 20px; accent-color: #6cedc7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="player">
    <canvas id="unity-canvas" width="720" height="1280" tabindex="0" aria-label="StageGame 네 개의 수 게임"></canvas>
    <div id="loading"><strong>네 개의 수</strong><span>대국을 준비하고 있어요</span><progress value="0" max="1"></progress></div>
    <div id="error" role="alert" hidden></div>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const failure = document.getElementById('error');
    const fail = message => { loading.hidden = true; failure.hidden = false; failure.textContent = '게임을 불러오지 못했습니다. 새로고침해 주세요.\n' + message; };
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => fail('게임 로더 파일 오류');
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      autoSyncPersistentDataPath: true,
      showBanner: (message, type) => { if (type === 'error') fail(message); else console.warn(message); }
    }, value => { loading.querySelector('progress').value = value; }).then(instance => {
      window.stageGameInstance = instance;
      loading.hidden = true;
      canvas.focus();
    }).catch(fail);
    document.body.appendChild(loader);
  </script>
</body>
</html>

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(

      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }

    openExternal({ href });
  });

  syncTheme();
})();

#sg-recruit-barracks-preview .sg-stage{display:flex;justify-content:center;padding:12px 0}
#sg-recruit-barracks-preview .sg-phone{--ink:#24291d;--olive:#4d5636;--paper:#f5f3e9;--portrait-scale:1;position:relative;container-type:inline-size;width:min(100%,390px);aspect-ratio:9/16;overflow:hidden;background:var(--paper);color:var(--ink);font-family:&quot;Malgun Gothic&quot;,Arial,sans-serif;border:1px solid #b5b6a8;box-sizing:border-box}
#sg-recruit-barracks-preview .sg-phone *{box-sizing:border-box}
#sg-recruit-barracks-preview .sg-host{height:14cqw;position:relative;background:#fff;border-bottom:1px solid #e0e0d7}
#sg-recruit-barracks-preview .sg-host-controls{position:absolute;right:3cqw;top:2.5cqw;border-radius:7cqw;background:#656661;color:#fff;padding:.5cqw 2.7cqw;font-size:6cqw;font-weight:500;line-height:1.3}
#sg-recruit-barracks-preview .sg-host-controls span{font-size:4cqw;color:#b9bab5;vertical-align:middle}
#sg-recruit-barracks-preview .sg-header{height:9cqw;display:flex;align-items:center;justify-content:center;position:relative;padding:0 6cqw}
#sg-recruit-barracks-preview .sg-header h1{font-size:7cqw;line-height:1;margin:0;font-weight:900;letter-spacing:-.4cqw;color:var(--ink)}
#sg-recruit-barracks-preview .sg-phone button{font:inherit;color:inherit;touch-action:manipulation}
#sg-recruit-barracks-preview .sg-pause{position:absolute;right:4cqw;top:0;width:11cqw;height:9cqw;border:0;background:transparent;font-size:6cqw!important;font-weight:900!important}
#sg-recruit-barracks-preview .sg-opponent{height:43.5cqw;position:relative;overflow:hidden}
#sg-recruit-barracks-preview .sg-barracks{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;image-rendering:pixelated}
#sg-recruit-barracks-preview .sg-portrait{position:absolute;left:50%;top:0;width:32cqw;height:43.5cqw;transform:translateX(-50%) scale(var(--portrait-scale));transform-origin:50% 100%;background-size:300% auto;background-position:0% -12.5cqw;background-repeat:no-repeat;image-rendering:pixelated}
#sg-recruit-barracks-preview .sg-rank{position:absolute;right:3cqw;bottom:3cqw;display:flex;align-items:center;gap:1.6cqw;padding:1.6cqw 2cqw;background:#f5f3e9;border:1px solid var(--ink);font-size:3.9cqw;font-weight:800;white-space:nowrap}
#sg-recruit-barracks-preview .sg-camo-star{display:block;width:6.8cqw;height:6.8cqw;background-color:#465332;background-image:linear-gradient(90deg,transparent 50%,#a5a578 50%),linear-gradient(0deg,transparent 55%,#68704a 55%);background-size:2.6cqw 2.1cqw,3.2cqw 3.2cqw;clip-path:polygon(50% 0,62% 34%,100% 38%,71% 61%,81% 100%,50% 78%,19% 100%,29% 61%,0 38%,38% 34%)}
#sg-recruit-barracks-preview .sg-speech{width:87cqw;height:9.8cqw;margin:0 auto .7cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--ink);background:#fffdf5;font-size:3.55cqw;line-height:1.32;font-weight:700;text-align:center;padding:.6cqw 2cqw;white-space:pre-line}
#sg-recruit-barracks-preview .sg-board{position:relative;width:87cqw;height:87cqw;margin:0 auto;background:#fff;border:1px solid var(--ink)}
#sg-recruit-barracks-preview .sg-grid{position:absolute;left:0;top:50%;width:100%;height:85.714286%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);border-top:1px solid var(--ink);border-right:1px solid var(--ink)}
#sg-recruit-barracks-preview .sg-cell{position:relative;border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:center;background:transparent;padding:0;border-top:0;border-right:0;border-radius:0;min-width:0}

#sg-recruit-barracks-preview .sg-stone.preview{opacity:.3}
#sg-recruit-barracks-preview .sg-stone.win{outline:1cqw solid #727e46;outline-offset:.25cqw}
#sg-recruit-barracks-preview .sg-turn{position:absolute;left:0;top:35%;width:100%;text-align:center;font-size:9cqw;font-weight:900;pointer-events:none;color:#2c351f;text-shadow:0 0 2px #fff}
#sg-recruit-barracks-preview .sg-actions{height:13.5cqw;display:flex;align-items:center;justify-content:space-between;width:87cqw;margin:0 auto;gap:2cqw}

#sg-recruit-barracks-preview .sg-place{width:12cqw;height:12cqw;flex:none;border:1px solid var(--ink);border-radius:50%;background:var(--olive);color:#fff!important;font-size:4.7cqw!important;font-weight:800!important;margin:0 3cqw}
#sg-recruit-barracks-preview .sg-phone button:disabled{opacity:.42}
#sg-recruit-barracks-preview .sg-phone .sg-cell:disabled{opacity:1}

#sg-recruit-barracks-preview .sg-modal{position:absolute;inset:14cqw 0 0;background:#20251c80;display:flex;align-items:center;justify-content:center;z-index:10}
#sg-recruit-barracks-preview .sg-dialog{width:78cqw;background:#faf8ed;border:2px solid var(--ink);padding:7cqw 5cqw;text-align:center}
#sg-recruit-barracks-preview .sg-dialog p{font-size:5cqw;font-weight:800;margin:0 0 6cqw}
#sg-recruit-barracks-preview .sg-dialog&gt;div{display:flex;gap:3cqw}
#sg-recruit-barracks-preview .sg-dialog button{flex:1;padding:3cqw 1cqw;background:var(--paper);border:1px solid var(--ink);font-size:4cqw}
#sg-recruit-barracks-preview .sg-dialog-ok{background:var(--olive)!important;color:#fff!important}
#sg-recruit-barracks-preview [hidden]{display:none!important}

&lt;script&gt;
(function(){
  const root=document.getElementById(&#x27;sg-recruit-barracks-preview&#x27;);
  const phone=root.querySelector(&#x27;.sg-phone&#x27;),portrait=root.querySelector(&#x27;.sg-portrait&#x27;),grid=root.querySelector(&#x27;.sg-grid&#x27;);
  const speech=root.querySelector(&#x27;.sg-speech&#x27;),modal=root.querySelector(&#x27;.sg-modal&#x27;),turn=root.querySelector(&#x27;.sg-turn&#x27;);
  const state={scene:&#x27;intro&#x27;,portraitScale:1};
  let selection=3,turnTimer=null,pending=null;
  portrait.style.backgroundImage=&#x27;url(&quot;&#x27;+root.querySelector(&#x27;.sg-source&#x27;).src+&#x27;&quot;)&#x27;;
  const labels={intro:&#x27;정면을 가리키는 까까머리 훈련병&#x27;,playing:&#x27;오른손은 턱 근처, 왼팔은 책상에 얹은 훈련병&#x27;,defeat:&#x27;양팔을 들고 하늘에 외치며 눈에서 불이 나는 훈련병&#x27;};
  function board(){
    const values=Array(42).fill(0);
    if(state.scene===&#x27;playing&#x27;){values[35]=1;values[36]=-1;values[37]=1;values[39]=-1;values[29]=1;}
    if(state.scene===&#x27;defeat&#x27;){values[35]=1;values[36]=1;values[37]=1;values[38]=1;values[39]=-1;values[28]=-1;values[29]=-1;values[30]=-1;}
    grid.replaceChildren();
    for(let row=0;row&lt;6;row++)for(let col=0;col&lt;7;col++){
      const cell=document.createElement(&#x27;button&#x27;);cell.type=&#x27;button&#x27;;cell.className=&#x27;sg-cell&#x27;;cell.setAttribute(&#x27;aria-label&#x27;,(col+1)+&#x27;열 &#x27;+(6-row)+&#x27;행&#x27;);cell.disabled=state.scene!==&#x27;playing&#x27;;

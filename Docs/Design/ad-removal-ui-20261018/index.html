<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 제거 · 검토용 시안</title><style>
@font-face{font-family:Pretendard;src:url(assets/Pretendard-Regular.woff2)}*{box-sizing:border-box}body{margin:0;background:#24291f;color:#f4edcf;font-family:Pretendard,Arial,sans-serif}header{padding:16px 24px;border-bottom:1px solid #65714d}h1{font-size:20px;margin:0 0 10px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}label{font-size:13px;display:flex;gap:6px;align-items:center}select,button,a.control{font:inherit;min-height:36px;border:1px solid #8b9674;background:#eae4cc;color:#252a1f;padding:6px 10px;border-radius:0}button{cursor:pointer}button:hover{background:#fff3cf}a{color:#edda9c}.caption{font-size:12px;color:#c4cbb6;margin:10px 0 0;line-height:1.5}.workspace{display:flex;min-height:480px;height:calc(100dvh - 160px);padding:18px;align-items:center;justify-content:center;overflow:hidden}.frame-shell{flex:none;position:relative;box-shadow:0 14px 42px #0e120bd9}iframe{border:0;display:block;transform-origin:top left;background:#b1ae96}.report{position:fixed;right:14px;bottom:10px;max-width:250px;padding:8px 12px;background:#20251fdd;color:#d7ddc9;font-size:11px;line-height:1.4;pointer-events:none}@media(max-width:700px){header{padding:12px}.workspace{height:calc(100dvh - 220px);min-height:390px}.report{display:none}}
</style></head><body><header><h1>광고 제거 패널 · 사용자 확인용 시안</h1><div class="controls">
<label>화면 <select id="size"><option value="360,640">1080×1920 · DPR 3</option><option value="390,844" selected>390×844</option><option value="320,568">320×568</option><option value="320,403">320×403 · 호스트 제외</option></select></label>
<label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
<label>실행 상태 <select id="state"><option value="returning" selected>재방문 · 이전 실행 대국 완료</option><option value="first">첫 실행</option><option value="no-game">재방문 · 이전 대국 미완료</option><option value="owned">광고 제거 구매자</option><option value="checking">구매 권한 확인 중</option><option value="product-failed">상품 조회 실패</option><option value="unsupported">판매 미지원 · 현재 GitHub Pages</option><option value="invite">초대 링크로 입장</option><option value="reconnect">대전 재접속 / 상대 대기</option><option value="tutorial">처음 안내 진행 중</option></select></label>
<button id="reopen">조건 확인 · 다시 열기</button><a class="control" id="full" href="preview.html" target="_blank" rel="noopener">시안만 열기</a><a href="design-spec.md">설계 설명</a></div>
<p class="caption">독립 HTML 시안입니다. 게임·SDK·결제와 연결되지 않습니다. ₩3,900은 기존 기획 예시이며 실제 판매 시 상품 조회 가격을 사용합니다. 1080×1920은360×640 CSS / DPR 3로 표시합니다. 프레임을 축소해 보여도 내부 CSS 입력 크기는 유지됩니다.</p></header>
<main class="workspace" id="workspace"><div class="frame-shell" id="shell"><iframe id="preview" title="광고 제거 패널 시안" src="preview.html?embedded=1"></iframe></div></main><output class="report" id="report">시안을 불러오는 중…</output>
<script>
const byId=id=>document.getElementById(id);const frame=byId('preview');let lastReport='';
function fit(){const [w,h]=byId('size').value.split(',').map(Number),area=byId('workspace');const scale=Math.min(1,(area.clientWidth-36)/w,(area.clientHeight-36)/h);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:`scale(${scale})`});Object.assign(byId('shell').style,{width:w*scale+'px',height:h*scale+'px'});byId('report').textContent=`${w}×${h} CSS · 표시 ${Math.round(scale*100)}% · ${lastReport}`;}
function apply(){const config={type:'preview-config',lang:byId('language').value,state:byId('state').value};frame.contentWindow.postMessage(config,location.origin==='null'?'*':location.origin);byId('full').href=`preview.html?lang=${config.lang}&state=${config.state}`;fit();}
for(const id of ['size','language','state'])byId(id).addEventListener('change',apply);byId('reopen').addEventListener('click',apply);frame.addEventListener('load',apply);window.addEventListener('resize',fit);window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.type!=='preview-status')return;lastReport=event.data.message;fit();});
</script></body></html>

<main class="lobby" id="lobby"><div><h1 id="game-title">이겨도 됩니까?</h1><p class="lobby-subtitle" id="lobby-subtitle">다음 대국을 준비하세요.</p></div><div class="stage-grid" aria-hidden="true"><button class="stage" tabindex="-1"><small>01단계</small>훈련병 강민재<div class="stars">★ ☆ ☆</div></button><button class="stage" tabindex="-1"><small>02단계</small>이병 문시온<div class="stars">★ ☆ ☆</div></button><button class="stage" tabindex="-1"><small>03단계</small>일병 오준호<div class="stars">★ ★ ☆</div></button><button class="stage" tabindex="-1"><small>04단계</small>상병 정한결<div class="stars">★ ★ ☆</div></button></div><div class="lobby-bottom"><button id="help">도움말</button><button id="settings">설정</button></div><div class="lobby-message" id="lobby-message" role="status"></div><button class="standalone-reopen" id="standalone-reopen">조건 확인 · 다시 열기</button></main>
<div class="scrim" id="scrim" hidden><section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="offer-title" aria-describedby="offer-benefits purchase-note"><button class="close" id="close" aria-label="닫기">×</button><p class="eyebrow" id="eyebrow">이겨도 됩니까?</p><h2 id="offer-title">광고 제거</h2><p class="intro" id="intro">대국에만 집중하세요.</p><ul class="benefits" id="offer-benefits"><li><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 4h22v16H1zm3 3v10h16V7z" fill-rule="evenodd"/><path d="M3 21 21 3l-2-2L1 19z"/></svg><span id="benefit-ads">전면·배너 광고 제거</span></li><li><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 1h8v3h4v10h-4v4H8v-4H4V4h4zm0 18h8v3H8zM7 6v6h3v3h4v-3h3V6z" fill-rule="evenodd"/></svg><span id="benefit-hint">싱글 힌트 판당 1회</span></li></ul><p class="purchase-note" id="purchase-note">전면·배너 광고가 영구적으로 사라집니다</p><button class="buy" id="buy">₩3,900 · 광고 제거</button><div class="bottom-actions"><button class="not-now" id="not-now">지금은 괜찮아요</button><button class="restore" id="restore">구매 복원</button></div><p class="feedback" id="feedback" role="status" hidden></p></section><span class="demo-note" id="demo-note">가격은 시안 예시 · 실제 결제는 진행되지 않습니다</span></div>
<script>
const el=id=>document.getElementById(id);let lang='ko',scenario='returning',open=false,lobbyClicks=0,shown=false,backEntry=false;const price='₩3,900';
const words={ko:{title:'광고 제거',game:'이겨도 됩니까?',intro:'대국에만 집중하세요.',ads:'전면·배너 광고 제거',hint:'싱글 힌트 판당 1회',note:'전면·배너 광고가 영구적으로 사라집니다',buy:`${price} · 광고 제거`,later:'지금은 괜찮아요',restore:'구매 복원',close:'닫기',demo:'가격은 시안 예시 · 실제 결제는 진행되지 않습니다',reopen:'조건 확인 · 다시 열기',lobby:'다음 대국을 준비하세요.',help:'도움말',settings:'설정',purchase:'구매 동작 예시입니다. 실제 결제나 권리 지급은 진행하지 않습니다.',restoreDone:'구매 복원 동작 예시입니다. 실제 구매 기록은 조회하지 않습니다.',dismissed:'패널을 닫았어요. 같은 실행에서는 자동으로 다시 열지 않습니다.',reasons:{returning:'재방문 · 이전 실행에서 대국 완료. 이번 실행에 1회 안내합니다.',first:'첫 실행: 광고 제거 안내 없이 바로 게임을 시작합니다.','no-game':'이전 실행에서 대국을 마치지 않아 안내하지 않습니다.',owned:'광고 제거 구매자: 구매 안내를 표시하지 않습니다.',checking:'구매 권한 확인 중: 확인을 마칠 때까지 안내하지 않습니다.','product-failed':'상품 조회 실패: 가격이 확인되지 않아 안내하지 않습니다.',unsupported:'현재 GitHub Pages: 실광고·IAP 미연동으로 판매 안내를 표시하지 않습니다.',invite:'친구 초대 입장 우선: 광고 제거 안내를 표시하지 않습니다.',reconnect:'대전 재접속·상대 대기 우선: 안내를 표시하지 않습니다.',tutorial:'처음 안내 우선: 광고 제거 안내를 표시하지 않습니다.'}},en:{title:'Remove ads',game:'Permission to Win?',intro:'Keep your focus on the board.',ads:'Remove interstitial & banner ads',hint:'1 solo hint per game',note:'Remove interstitial and banner ads permanently.',buy:`${price} · Remove ads`,later:'Not now',restore:'Restore',close:'Close',demo:'Example price · No real payment',reopen:'Check conditions · Reopen',lobby:'Ready for your next match.',help:'Help',settings:'Settings',purchase:'Purchase preview only. No payment is made and no entitlement is granted.',restoreDone:'Restore preview only. No purchase history is requested.',dismissed:'Dismissed. This offer will not reopen automatically during this launch.',reasons:{returning:'Returning player with a completed game on a previous launch. Show once this launch.',first:'First launch: start playing without this offer.','no-game':'No completed game on a previous launch: do not show.',owned:'Already purchased: do not show this offer.',checking:'Checking purchase entitlement: wait before showing any offer.','product-failed':'Product lookup failed: do not show without a verified price.',unsupported:'Current GitHub Pages: ads and IAP are not connected. Do not show this offer.',invite:'Joining a friend takes priority. Do not show this offer.',reconnect:'Reconnecting or waiting for an opponent takes priority. Do not show.',tutorial:'First-time guidance takes priority. Do not show this offer.'}}};
function report(message){parent.postMessage({type:'preview-status',message},location.origin==='null'?'*':location.origin);}
function copy(){const t=words[lang];document.documentElement.lang=lang;for(const[id,key]of Object.entries({'offer-title':'title','eyebrow':'game','game-title':'game','intro':'intro','benefit-ads':'ads','benefit-hint':'hint','purchase-note':'note','buy':'buy','not-now':'later','restore':'restore','demo-note':'demo','standalone-reopen':'reopen','lobby-subtitle':'lobby','help':'help','settings':'settings'}))el(id).textContent=t[key];el('close').setAttribute('aria-label',t.close);}
function hide(reason='dismissed',fromBack=false){if(!open)return;open=false;el('scrim').hidden=true;el('lobby').inert=false;el('lobby-message').textContent=words[lang][reason]||words[lang].dismissed;el('standalone-reopen').focus({preventScroll:true});report(`닫힘 · 로비 클릭 ${lobbyClicks}회`);if(fromBack)backEntry=false;else if(backEntry)history.replaceState({adRemovalPreview:false},'');}
function show(){if(scenario!=='returning'||shown){el('lobby-message').textContent=words[lang].reasons[scenario];report('미노출: '+scenario);return;}shown=true;open=true;el('scrim').hidden=false;el('lobby').inert=true;el('feedback').hidden=true;if(backEntry)history.replaceState({adRemovalPreview:true},'');else history.pushState({adRemovalPreview:true},'');backEntry=true;el('close').focus({preventScroll:true});report('노출 · X/바깥/지금은 괜찮아요/뒤로로 닫기');}
function configure(nextLang=lang,nextState=scenario){if(open)hide();lang=nextLang==='en'?'en':'ko';scenario=words[lang].reasons[nextState]?nextState:'returning';shown=false;copy();el('lobby-message').textContent=words[lang].reasons[scenario];setTimeout(show,0);}
el('scrim').addEventListener('click',event=>{if(event.target===el('scrim')){event.preventDefault();event.stopPropagation();hide();}});el('card').addEventListener('click',event=>event.stopPropagation());for(const id of ['close','not-now'])el(id).addEventListener('click',()=>hide());el('buy').addEventListener('click',()=>{el('feedback').textContent=words[lang].purchase;el('feedback').hidden=false;report('구매 CTA 예시 · 결제 없음');});el('restore').addEventListener('click',()=>{el('feedback').textContent=words[lang].restoreDone;el('feedback').hidden=false;report('복원 예시 · 기록 조회 없음');});el('standalone-reopen').addEventListener('click',()=>configure());el('lobby').addEventListener('click',event=>{if(event.target.closest('.stage,#help,#settings')){lobbyClicks++;report(`로비 클릭 ${lobbyClicks}회`);}});window.addEventListener('popstate',()=>hide('dismissed',true));window.addEventListener('keydown',event=>{if(!open)return;if(event.key==='Escape'){event.preventDefault();hide();}if(event.key==='Tab'){const buttons=[el('close'),el('buy'),el('not-now'),el('restore')],first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='preview-config')return;configure(event.data.lang,event.data.state);});const query=new URLSearchParams(location.search);if(query.get('embedded')==='1')copy();else configure(query.get('lang'),query.get('state'));
</script></body></html>
